name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' build
      - run: python -m pytest
      - run: python -m build
      - run: python -m cbdesign validate examples/checkerboard.json --output /tmp/cbdesign-v1
      - run: python -m cbdesign validate examples/rough-stock-board.json --output /tmp/cbdesign-v2
      - run: python -m cbdesign demo --pattern checkerboard > /tmp/cbdesign-request.json
      - run: python -m cbdesign generate /tmp/cbdesign-request.json --output /tmp/cbdesign-generated
      - run: python -m cbdesign search /tmp/cbdesign-request.json --output /tmp/cbdesign-search --work-budget 4
