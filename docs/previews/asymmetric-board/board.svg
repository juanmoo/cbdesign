rce maple-wide; grain (0, 0, 1); region 5 mm × 32 mm × 18 mm (X × Y × Z)</title></rect><g><title>grain normal to displayed face: +1Z</title><circle class="grain" cx="187.66" cy="473.00" r="4" fill="none"/><circle cx="187.66" cy="473.00" r="1.2" fill="#1a202c"/></g><rect class="outline" x="144.69" y="348.00" width="23.44" height="250.00" fill="#c9975b"><title>maple; source maple-narrow; grain (0, 0, 1); region 3 mm × 32 mm × 18 mm (X × Y × Z)</title></rect><g><title>grain normal to displayed face: +1Z</title><circle class="grain" cx="156.41" cy="473.00" r="4" fill="none"/><circle cx="156.41" cy="473.00" r="1.2" fill="#1a202c"/></g><rect class="outline" x="90.00" y="348.00" width="54.69" height="250.00" fill="#4a2d1b"><title>walnut; source walnut; grain (0, 0, 1); region 7 mm × 32 mm × 18 mm (X × Y × Z)</title></rect><g><title>grain normal to displayed face: +1Z</title><circle class="grain" cx="117.34" cy="473.00" r="4" fill="none"/><circle cx="117.34" cy="473.00" r="1.2" fill="#1a202c"/></g><line class="dimension" x1="90.00" y1="610.00" x2="207.19" y2="610.00"/><text class="dim-label" text-anchor="middle" x="148.59" y="623.00">X 15 mm</text><line class="dimension" x1="76.00" y1="98.00" x2="76.00" y2="598.00"/><text class="dim-label" text-anchor="end" x="72.00" y="348.00">Y 64 mm</text><text class="small" x="221.19" y="111.00">Z 18 mm</text>
