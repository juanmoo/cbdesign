<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820.0 661.0" role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">First-stage panels from nominal replay</title>
  <desc id="svg-description">Dimensioned nominal replay geometry. Region outlines preserve physical boundaries, including same-species joints; arrows show grain direction in the displayed plane.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/></marker>
  </defs>
  <style>
    text { font-family: sans-serif; fill: #1a202c; } .heading { font-size: 16px; font-weight: 700; } .label { font-size: 12px; } .small { font-size: 10px; }
    .outline { stroke: #1a202c; stroke-width: 1.2; vector-effect: non-scaling-stroke; } .grain { stroke: #1a202c; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .dimension { stroke: #4a5568; stroke-width: 1; vector-effect: non-scaling-stroke; } .dim-label { font-size: 11px; fill: #2d3748; }
  </style>
  <rect width="100%" height="100%" fill="white"/>
  <text class="heading" x="20" y="18">First-stage panels from nominal replay</text><rect class="outline" x="20" y="24" width="14" height="14" fill="#c9975b"><title>maple: #c9975b</title></rect><text class="label" x="40" y="36">maple</text><rect class="outline" x="145" y="24" width="14" height="14" fill="#4a2d1b"><title>walnut: #4a2d1b</title></rect><text class="label" x="165" y="36">walnut</text><text class="small" x="20" y="54">Grain: arrows follow XY coordinates (Y down); circled dot/cross = +Z/−Z, normal to the face.</text><text class="label" x="90.00" y="82.00">asym-panel — 17 mm × 60 mm × 32 mm (X × Y × Z)</text><title>asym-panel — 17000 × 60000 × 32000 µm (X × Y × Z)</title><rect class="outline" x="90.00" y="98.00" width="141.67" height="500.00" fill="#f7fafc"/><rect class="outline" x="90.00" y="98.00" width="58.33" height="500.00" fill="#c9975b"><title>maple; source maple-wide; grain (0, 1, 0); region 7 mm × 60 mm × 32 mm (X × Y × Z)</title></rect><line class="grain" x1="119.17" y1="198.00" x2="119.17" y2="498.00" marker-end="url(#arrow)"/><rect class="outline" x="148.33" y="98.00" width="25.00" height="500.00" fill="#c9975b"><title>maple; source maple-narrow; grain (0, 1, 0); region 3 mm × 60 mm × 32 mm (X × Y × Z)</title></rect><line class="grain" x1="160.83" y1="198.00" x2="160.83" y2="498.00" marker-end="url(#arrow)"/><rect class="outline" x="173.33" y="98.00" width="58.33" height="500.00" fill="#4a2d1b"><title>walnut; source walnut; grain (0, 1, 0); region 7 mm × 60 mm × 32 mm (X × Y × Z)</title></rect><line class="grain" x1="202.50" y1="198.00" x2="202.50" y2="498.00" marker-end="url(#arrow)"/><line class="dimension" x1="90.00" y1="610.00" x2="231.67" y2="610.00"/><text class="dim-label" text-anchor="middle" x="160.83" y="623.00">X 17 mm</text><line class="dimension" x1="76.00" y1="98.00" x2="76.00" y2="598.00"/><text class="dim-label" text-anchor="end" x="72.00" y="348.00">Y 60 mm</text><text class="small" x="245.67" y="111.00">Z 32 mm</text>
</svg>